global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:19090']
  - job_name: host
    static_configs:
      - targets: ['127.0.0.1:19100']
  - job_name: amd_gpu
    static_configs:
      - targets: ['127.0.0.1:19101']
  - job_name: llm
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:18983']
        labels:
          deployment: pation-model-qwen38-27b-w3a4

  - job_name: gateway
    static_configs:
      - targets: ['127.0.0.1:18982']

  - job_name: cpu_vision
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:18984']
