name: ai-public-api
services:
  caddy:
    image: m.daocloud.io/docker.io/library/caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    # This server's ACME HTTP/2 requests repeatedly time out; use HTTP/1.1 outbound.
    environment:
      GODEBUG: http2client=0
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
